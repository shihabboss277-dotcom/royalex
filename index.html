<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Royalex"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Royalex Business</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#14161a;--mut:#6b7280;--line:#e5e7eb;--gold:#f2b705;--green:#15803d;--red:#dc2626;--blk:#0b0b0d;--inp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--card:#17181c;--ink:#f3f4f6;--mut:#9ca3af;--line:#2a2c33;--inp:#1f2127}}
:root[data-theme="dark"]{--bg:#0b0b0d;--card:#17181c;--ink:#f3f4f6;--mut:#9ca3af;--line:#2a2c33;--inp:#1f2127}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hind Siliguri",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}
.gold{color:var(--gold)}.logo{font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:.06em;color:var(--gold)}
#login{background:radial-gradient(circle at 50% 0,#3a2c05,#000 60%);color:#fff;min-height:100vh;padding:56px 28px;text-align:center;max-width:480px;margin:0 auto}
#login .logo{font-size:38px;margin:8px 0 0}#login small{letter-spacing:.5em;color:var(--gold)}
.fld{display:block;width:100%;padding:13px 14px;margin:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--inp)}
#login .fld{background:#15161a;border-color:#3a3320;color:#fff}
.btn{border:0;border-radius:10px;padding:13px;width:100%;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
.btn.g{background:var(--gold);color:#111}.btn.k{background:var(--blk);color:#fff}.btn.o{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:focus-visible,.fld:focus-visible,.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blk);color:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px}
header.top h1{font-size:17px;margin:0;flex:1;text-align:center}header.top button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;min-width:32px}
main{padding:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid>*{min-width:0}img{max-width:100%}
.stat{border-radius:14px;padding:14px;color:#fff}.stat b{display:block;font-size:24px}.stat span{font-size:13px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
h2{font-size:16px;margin:18px 0 8px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.tabs button{border:0;border-radius:99px;padding:7px 16px;background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--blk);color:var(--gold);font-weight:700}
.pcard{display:flex;flex-direction:column;gap:6px}
.ph{height:130px;border-radius:10px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#1a1a1a,#4a3a0a);color:var(--gold)}
.pcard small{color:var(--mut)}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;font-weight:600;white-space:nowrap}
.Pending{background:#fef3c7;color:#92400e}.Confirm{background:#dbeafe;color:#1d4ed8}.Cancel{background:#fee2e2;color:#b91c1c}.Return{background:#ede9fe;color:#6d28d9}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.mut{color:var(--mut);font-size:13px}.pos{color:var(--green)}.neg{color:var(--red)}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 14px #0005}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:var(--blk);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
.nav button{flex:1;background:none;border:0;color:#9ca3af;font-size:11px;cursor:pointer;display:grid;gap:2px;justify-items:center}
.nav button i{font-style:normal;font-size:20px}.nav button.on{color:var(--gold)}
.modal{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px}label{font-size:13px;color:var(--mut)}
.big{background:var(--green);color:#fff;border-radius:14px;padding:16px}.big b{font-size:30px;display:block}
.wrap{overflow-x:auto}
</style>

</head>

<script>
var S={},U=null,V='dash',TAB='সব',OF='সব',OID=null,Q='';
function load(){try{S=JSON.parse(localStorage.getItem('rx')||'null')||{}}catch(e){S={}}
if(!S.p){S={pin:'',p:[
{id:1,biz:'R',name:'Royal Black',buy:950,sell:1500,stock:12,sku:'RB-001'},
{id:2,biz:'R',name:'Golden Chain',buy:700,sell:1200,stock:8,sku:'RB-002'},
{id:3,biz:'R',name:'Silver Edge',buy:600,sell:1100,stock:15,sku:'RB-003'},
{id:4,biz:'R',name:'Matte Black',buy:650,sell:1100,stock:6,sku:'RB-004'},
{id:5,biz:'C',name:'Men’s T-Shirt',buy:300,sell:550,stock:25,sku:'CL-001'},
{id:6,biz:'C',name:'Polo Shirt',buy:450,sell:700,stock:18,sku:'CL-002'}],
o:[{id:1,no:'RX-1001',cust:'রাফিকুল ইসলাম',phone:'01712345678',addr:'চট্টগ্রাম',items:[{pid:1,qty:1,price:1500}],del:120,disc:0,paid:500,method:'bKash',status:'Pending',date:'2026-10-17',stocked:false,courier:'',track:''}],
x:[{id:1,amt:500,why:'প্যাকেজিং',date:'2026-10-15'}],n:1002}}}
var DB=null,ADM=false;
function pub(){var c=Object.assign({},S);delete c.pin;return JSON.stringify(c)}
var T0=null;function save(){if(!DB)return;clearTimeout(T0);T0=setTimeout(function(){T0=null;sb.from('app_state').update({data:JSON.parse(pub()),updated_at:new Date().toISOString()}).eq('id',1).then(function(r){if(r.error)toast('সেভ হয়নি, ইন্টারনেট দেখুন')})},400)}
var T=function(n){return '৳ '+Number(n||0).toLocaleString('bn-BD')};
var N=function(n){return Number(n||0).toLocaleString('bn-BD')};
var E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

function tot(o){var s=0;o.items.forEach(function(i){s+=i.qty*i.price});return s-o.disc+o.del}
function prod(id){return S.p.find(function(p){return p.id==id})||{name:'(মুছে ফেলা)'}}
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function stats(){var c=S.o.filter(function(o){return o.status=='Confirm'});
var rev=sum(c,tot),paid=sum(c,function(o){return o.paid}),ex=sum(S.x,function(x){return x.amt});
var inc=sum(S.i||[],function(x){return x.amt}),col=sum(c,function(o){return o.col||0}),dep=sum(c,function(o){return o.dep||0});return{rev:rev,due:rev-paid-col,cash:paid+dep-ex+inc,cour:col-dep,ex:ex,stockv:sum(S.p,function(p){return p.buy*p.stock}),c:c}}
var sb=supabase.createClient('https://xvcnpfdmvfdafbkgjvfy.supabase.co','sb_publishable_OHv7zjKwNVvRdmNjjxXs3w_8lVq_db6');
var ASSET={upload:async function(b){return{url:await up(b)}}};
async function up(b){var n=Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg';var r=await sb.storage.from('photos').upload(n,b,{contentType:'image/jpeg'});if(r.error)throw r.error;return sb.storage.from('photos').getPublicUrl(n).data.publicUrl}
async function enter(user){var r=await sb.from('members').select('role').eq('user_id',user.id).maybeSingle();if(!r.data){await sb.auth.signOut();U=null;render();toast('এই অ্যাকাউন্টের অনুমতি নেই');return}ADM=r.data.role=='admin';var q=await sb.from('app_state').select('data').eq('id',1).single();var d=q.data&&q.data.data;U=user.email;if(d&&d.p){S=d;S.s=S.s||[];S.x=S.x||[]}else{S={p:[],o:[],x:[],i:[],s:[],h:[],n:1001}}DB=true;if(!(d&&d.p))save();render()}
async function login(){var e=$('u').value.trim(),p=$('pw').value;if(!e||!p){$('err').textContent='জিমেইল ও পাসওয়ার্ড দিন';return}$('err').textContent='অপেক্ষা করুন...';var r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error){$('err').textContent='জিমেইল বা পাসওয়ার্ড ভুল';return}await enter(r.data.user)}
function out(){sb.auth.signOut();U=null;DB=false;ADM=false;S={p:[],o:[],x:[],i:[],s:[],h:[],n:1001};render()}
function setStatus(id,st){var o=S.o.find(function(x){return x.id==id});
if(st=='Confirm'&&!o.stocked){o.items.forEach(function(i){adj(i,-1)});o.stocked=true}
if((st=='Cancel'||st=='Return')&&o.stocked){o.items.forEach(function(i){adj(i,1)});o.stocked=false}
o.status=st;(S.h=S.h||[]).unshift({t:Date.now(),m:U+': #'+o.no+' → '+st});S.h=S.h.slice(0,100);save();render()}
function nav(v,id){Q='';V=v;OID=id||null;render();window.scrollTo(0,0)}
function hdr(t,back){return '<header class="top">'+(back?'<button onclick="nav(\''+back+'\')" aria-label="পেছনে">←</button>':'<span class="logo" style="font-size:15px">'+(nm('logo','')?'<img src="'+E(nm('logo',''))+'" alt="" style="height:22px;vertical-align:middle;margin-right:6px">':'♛ ')+E(nm('brand','ROYALEX'))+'</span>')+'<h1>'+(back?t:'')+'</h1><button onclick="toggleTheme()" aria-label="থিম">◐</button></header>'}
function toggleTheme(){var r=document.documentElement;r.dataset.theme=(r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches))?'light':'dark'}
function render(){var r=$('root');
if(!U){r.innerHTML='<div id="login"><div style="font-size:54px;color:var(--gold)">♛</div><div class="logo">ROYALEX</div><small>BUSINESS</small><div style="margin:8px 0 30px;color:#cbd5e1;font-size:13px">Dream · Plan · Grow</div><input id="u" class="fld" type="email" placeholder="জিমেইল" autocomplete="username"><input id="pw" type="password" class="fld" placeholder="পাসওয়ার্ড" autocomplete="current-password"><div id="err" class="neg" style="min-height:22px"></div><button class="btn g" onclick="login()">লগইন করুন</button><p style="font-size:12px;color:#9ca3af;margin-top:30px">v1.0.0 · শুধু অনুমোদিত সদস্য</p></div>';return}
var h='';if(!ADM&&['bal','rep','supp','del','arch'].indexOf(V)>=0)V='dash';
if(V=='dash')h=dash();else if(V=='prod')h=prods();else if(V=='ord')h=ords();else if(V=='od')h=odet();else if(V=='bal')h=bal();else if(V=='more')h=more();else if(V=='cust')h=cust();else if(V=='supp')h=supp();else if(V=='note')h=note();else if(V=='sett')h=ADM?sett():sett2();else if(V=='arch')h=arch();else if(V=='cal')h=cal();else if(V=='del')h=del();else h=rep();
if(!ADM&&V=='od')h=h.replace(/<h2>কুরিয়ার<\/h2>[\s\S]*?(<button class="btn k")/,'$1');r.innerHTML='<div id="app">'+h+navbar()+'</div>';var q=$('q');if(q&&Q){q.focus();q.setSelectionRange(Q.length,Q.length)}}
function navbar(){var it=[['dash','⌂','ড্যাশবোর্ড'],['prod','▦','পণ্য'],['ord','☰','অর্ডার'],['bal','৳','ব্যালেন্স'],['rep','▥','রিপোর্ট'],['more','☷','আরও']];
return '<nav class="nav">'+it.filter(function(i){return ADM||(i[0]!='bal'&&i[0]!='rep')}).map(function(i){return '<button class="'+((V==i[0]||(V=='od'&&i[0]=='ord')||(i[0]=='more'&&['cust','supp','note','sett','arch','cal','del'].indexOf(V)>=0))?'on':'')+'" onclick="nav(\''+i[0]+'\')"><i>'+i[1]+'</i>'+i[2]+'</button>'}).join('')+'</nav>'}
function dash(){var s=stats(),rb=sum(S.c=S.o.filter(function(o){return o.status=='Confirm'}),function(o){return sum(o.items.filter(function(i){return prod(i.pid).biz=='R'}),function(i){return i.qty*i.price})}),cb=s.rev-rb;
return hdr()+'<main><h2 style="margin-top:0">স্বাগতম, '+E(U)+'</h2><div class="grid"><div class="stat" style="background:#15803d"><span>মোট অর্ডার</span><b>'+N(S.o.length)+'</b></div><div class="stat" style="background:#2563eb"><span>মোট বিক্রি</span><b>'+T(s.rev)+'</b></div><div class="stat" style="background:#7c3aed"><span>পণ্য সংখ্যা</span><b>'+N(S.p.length)+'</b></div><div class="stat" style="background:#f59e0b"><span>বকেয়া পাওনা</span><b>'+T(s.due)+'</b></div></div><h2>দুই ব্যবসা সারাংশ</h2><div class="grid"><div class="card"><b>'+E(nm('n1','Royalex Bracelets'))+'</b><div class="gold" style="font-size:20px">'+T(rb)+'</div><small class="mut">বিক্রি</small></div><div class="card"><b>'+E(nm('n2','Clothing Business'))+'</b><div class="gold" style="font-size:20px">'+T(cb)+'</div><small class="mut">বিক্রি</small></div></div>'+lowStock()+'</main><button class="fab" onclick="orderForm()" aria-label="নতুন অর্ডার">+</button>'}
function lowStock(){var l=S.p.filter(function(p){return !p.arch&&p.stock<=5});return l.length?'<h2>কম স্টক সতর্কতা</h2><div class="card">'+l.map(function(p){return '<div class="row"><span>'+E(p.name)+'</span><span class="neg">স্টক: '+N(p.stock)+'</span></div>'}).join('')+'</div>':''}
function prods(){var bz={'সব':'','Royalex':'R','Clothing':'C'},l=S.p.filter(function(p){return !p.arch&&(!bz[TAB]||p.biz==bz[TAB])&&p.name.toLowerCase().indexOf(Q.toLowerCase())>=0});
return hdr('পণ্য তালিকা')+'<main><div class="tabs">'+Object.keys(bz).map(function(k){return '<button class="'+(TAB==k?'on':'')+'" onclick="TAB=\''+k+'\';render()">'+k+'</button>'}).join('')+'</div><input class="fld" placeholder="পণ্য খুঁজুন..." value="'+E(Q)+'" oninput="Q=this.value;render();var e=$(\'q\');" id="q" style="margin-top:0"><div class="grid">'+l.map(function(p){return '<div class="card pcard">'+(p.img&&p.img[0]?'<img onclick="gal('+p.id+')" style="cursor:pointer" src="'+E(p.img[0])+'" alt="'+E(p.name)+'" style="width:100%;height:130px;object-fit:cover;border-radius:10px">':'<div class="ph">'+(p.biz=='R'?'◎':'👕')+'</div>')+'<b>'+E(p.name)+'</b><small>স্টক: '+N(p.stock)+' · <span class="mut">'+E(p.sku)+'</span></small><button class="btn" onclick="orderForm('+p.id+')">অর্ডার করুন</button>'+(ADM?'<button class="btn o" style="padding:7px" onclick="prodForm('+p.id+')">সম্পাদনা</button>':'')+'</div>'}).join('')+'</div></main>'+(ADM?'<button class="fab" onclick="prodForm()" aria-label="নতুন পণ্য">+</button>':'')}
function ords(){var l=S.o.filter(function(o){return(OF=='সব'||o.status==OF)&&(o.no+o.cust+o.phone).toLowerCase().indexOf(Q.toLowerCase())>=0}).slice().reverse();
return hdr('অর্ডার তালিকা')+'<main><div class="tabs">'+['সব','Pending','Confirm','Cancel','Return'].map(function(k){return '<button class="'+(OF==k?'on':'')+'" onclick="OF=\''+k+'\';render()">'+k+'</button>'}).join('')+'</div><input class="fld" placeholder="অর্ডার নম্বর / গ্রাহক খুঁজুন..." value="'+E(Q)+'" oninput="Q=this.value;render()" style="margin-top:0" id="q"><div class="card">'+(l.length?l.map(function(o){return '<div class="row" style="cursor:pointer" onclick="nav(\'od\','+o.id+')"><div style="display:flex;gap:3px">'+o.items.slice(0,2).map(function(i){return th(i.pid)}).join('')+'</div><div style="flex:1"><b>#'+o.no+'</b> <span class="mut">'+E(o.cust)+'</span><div class="mut">'+o.date+'</div></div><div style="text-align:right"><span class="pill '+o.status+'">'+o.status+'</span><div><b>'+T(tot(o))+'</b></div></div></div>'}).join(''):'<p class="mut">কোনো অর্ডার নেই। নিচের বোতাম দিয়ে নতুন অর্ডার করুন।</p>')+'</div><button class="btn" style="margin-top:12px" onclick="orderForm()">নতুন অর্ডার</button></main>'}
function odet(){var o=S.o.find(function(x){return x.id==OID});if(!o)return ords();
